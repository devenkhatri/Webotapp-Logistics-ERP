name: webotapp-logistics-erp

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: logistics_erp_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - WAIT_FOR_DB=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logistics_network

  web:
    image: nginx:1.27-alpine
    container_name: logistics_erp_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8001}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - logistics_network

  db:
    image: mysql:8.0
    container_name: logistics_erp_db
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-courier_erp}
      MYSQL_USER: ${DB_USERNAME:-courier_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - logistics_network

  redis:
    image: redis:7-alpine
    container_name: logistics_erp_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - logistics_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: logistics_erp_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logistics_network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: logistics_erp_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - logistics_network

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

networks:
  logistics_network:
    driver: bridge
